[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-skill"
version = "0.1.0"
description = "Neo Skill P0：以 Skill 为入口、以 flow-core 为确定性内核的研发闭环"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 仅一个第三方依赖，锁定范围；其余全部使用标准库
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.16,<0.17",
    "mypy>=2.0,<3.0",
]

[tool.setuptools]
packages = ["flow_core", "flow_core.commands"]
package-dir = { "flow_core" = "skills/neo-skill/runtime/flow_core" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    # 夹具构建可能超过 2 分钟时用它标记（SRS-NFR-004 的规模夹具）；预算断言本身不放宽
    "slow: 重量级夹具/基准用例（默认也运行；CI 可分片或加 -m 'not slow'）",
]
# 测试按文件分批跑（共享设计 §10）：不要用一条命令跑全套大 fixture。

# ---------------------------------------------------------------------------
# 静态检查（scripts/check.sh 与 CI 共用；retro 2026-11-02 引入）
#
# 只开「能抓真错误」的规则：未用导入/变量、盲 except、subprocess 未声明 check、
# 类型可判定错误。刻意不开全部风格规则（ISC/COM/PLW 之类的排版偏好）——
# 那些噪音会让人关掉检查，反而失去价值。
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "F",      # pyflakes：未用导入/变量、未定义名、f-string 无占位符
    "E9",     # 语法/运行时致命问题
    "B",      # bugbear：可变默认值、循环变量未用、zip 无 strict
]
ignore = [
    "B008",   # argparse 里 func=... 的默认参数是惯用法
]

[tool.ruff.lint.per-file-ignores]
# 测试里允许较松：夹具与断言辅助常需要未用参数
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
# flow_core 是唯一被测对象；tests 不进类型检查（黑盒测试没有类型契约）
files = ["skills/neo-skill/runtime/flow_core"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
